[workspace]
resolver = "2"
members = [
  "crates/fabric-types",
  "crates/fabric-state",
  "crates/fabric-governance",
  "crates/fabric-runtime",
  "services/fabricd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "json", "ws"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
futures = "0.3"
http = "1.3"
parking_lot = "0.12"
prost = "0.13"
redb = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tonic = "0.13"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1.2", features = ["serde"] }
